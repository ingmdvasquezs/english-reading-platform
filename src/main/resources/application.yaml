spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/english_reading}
    username: ${DB_USERNAME:english_user}
    password: ${DB_PASSWORD:english_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  webservices:
    path: /ws