spring:
  servlet:
    multipart:
      max-file-size: ${DOCUMENT_MULTIPART_MAX_FILE_SIZE:50MB}
      max-request-size: ${DOCUMENT_MULTIPART_MAX_REQUEST_SIZE:51MB}
  datasource:
    hikari:
      maximum-pool-size: ${DB_MAXIMUM_POOL_SIZE:10}
      minimum-idle: ${DB_MINIMUM_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT:30000}
      idle-timeout: ${DB_IDLE_TIMEOUT:600000}
      max-lifetime: ${DB_MAX_LIFETIME:1800000}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.batch_size: 100
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true

  webservices:
    path: /ws

  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  metrics:
    tags:
      application: ${spring.application.name:english-reading-platform}

logging:
  pattern:
    correlation: "[correlationId=%X{correlationId:-none}] "
  level:
    # The framework otherwise logs rejected XML values verbatim.
    org.springframework.ws.soap.server.endpoint.interceptor.PayloadValidatingInterceptor: ERROR

security:
  jwt:
    expiration: ${JWT_EXPIRATION:3600s}

dictionary:
  client:
    timeout: ${DICTIONARY_CLIENT_TIMEOUT:7s}
    max-retries: ${DICTIONARY_CLIENT_MAX_RETRIES:1}
    retry-delay: ${DICTIONARY_CLIENT_RETRY_DELAY:400ms}
  merriam-webster:
    base-url: ${MERRIAM_WEBSTER_BASE_URL:https://www.dictionaryapi.com}
    api-key: ${MERRIAM_WEBSTER_API_KEY:}
    connect-timeout: ${MERRIAM_WEBSTER_CONNECT_TIMEOUT:2s}
    read-timeout: ${MERRIAM_WEBSTER_READ_TIMEOUT:3s}

translation:
  client:
    timeout: ${TRANSLATION_CLIENT_TIMEOUT:7s}
    max-retries: ${TRANSLATION_CLIENT_MAX_RETRIES:1}
    retry-delay: ${TRANSLATION_CLIENT_RETRY_DELAY:400ms}
  azure:
    base-url: ${AZURE_TRANSLATOR_BASE_URL:https://api.cognitive.microsofttranslator.com}
    api-key: ${AZURE_TRANSLATOR_KEY:}
    region: ${AZURE_TRANSLATOR_REGION:}
    connect-timeout: ${AZURE_TRANSLATOR_CONNECT_TIMEOUT:2s}
    read-timeout: ${AZURE_TRANSLATOR_READ_TIMEOUT:3s}

recommendation:
  v2:
    min-global-classified-words: ${RECOMMENDATION_V2_MIN_GLOBAL_CLASSIFIED_WORDS:30}

# Security hardening defaults. Override with environment-specific configuration when necessary.
app:
  documents:
    storage-root: ${DOCUMENT_STORAGE_ROOT:.private-assets}
    max-source-bytes: ${DOCUMENT_MAX_SOURCE_BYTES:52428800}
    max-zip-entries: ${DOCUMENT_MAX_ZIP_ENTRIES:2000}
    max-entry-bytes: ${DOCUMENT_MAX_ENTRY_BYTES:10485760}
    max-expanded-bytes: ${DOCUMENT_MAX_EXPANDED_BYTES:157286400}
    max-compression-ratio: ${DOCUMENT_MAX_COMPRESSION_RATIO:100}
    max-cover-bytes: ${DOCUMENT_MAX_COVER_BYTES:10485760}
    max-cover-pixels: ${DOCUMENT_MAX_COVER_PIXELS:25000000}
    max-pdf-pages: ${DOCUMENT_MAX_PDF_PAGES:1000}
    max-extracted-characters: ${DOCUMENT_MAX_EXTRACTED_CHARACTERS:5000000}
    supported-languages: ${DOCUMENT_SUPPORTED_LANGUAGES:en}
    executor-core-size: ${DOCUMENT_EXECUTOR_CORE_SIZE:2}
    executor-max-size: ${DOCUMENT_EXECUTOR_MAX_SIZE:4}
    executor-queue-capacity: ${DOCUMENT_EXECUTOR_QUEUE_CAPACITY:20}
    orphan-minimum-age: ${DOCUMENT_ORPHAN_MINIMUM_AGE:24h}
    reconciliation-delay: ${DOCUMENT_RECONCILIATION_DELAY:24h}
  languages:
    enabled-learning: ${LANGUAGES_ENABLED_LEARNING:en}
    enabled-content: ${LANGUAGES_ENABLED_CONTENT:en}
  correlation-id:
    header: X-Correlation-ID
    maximum-length: 64
  security:
    max-request-bytes: ${MAX_SOAP_REQUEST_BYTES:1200000}
  input:
    max-name-characters: ${MAX_NAME_CHARACTERS:100}
    max-email-characters: ${MAX_EMAIL_CHARACTERS:254}
    max-password-characters: ${MAX_PASSWORD_CHARACTERS:128}
    max-title-characters: ${MAX_TITLE_CHARACTERS:200}
    max-reading-content-bytes: ${MAX_READING_CONTENT_BYTES:1048576}
    max-word-characters: ${MAX_WORD_CHARACTERS:100}
    max-onboarding-words: ${MAX_ONBOARDING_WORDS:100}
  rate-limit:
    maximum-buckets: ${RATE_LIMIT_MAXIMUM_BUCKETS:10000}
    login:
      requests: ${LOGIN_RATE_REQUESTS:10}
      window: ${LOGIN_RATE_WINDOW:1m}
    register:
      requests: ${REGISTER_RATE_REQUESTS:5}
      window: ${REGISTER_RATE_WINDOW:1h}
    lookup:
      requests: ${LOOKUP_RATE_REQUESTS:30}
      window: ${LOOKUP_RATE_WINDOW:1m}
    analyze:
      requests: ${ANALYZE_RATE_REQUESTS:10}
      window: ${ANALYZE_RATE_WINDOW:1m}
    reader:
      requests: ${READER_RATE_REQUESTS:20}
      window: ${READER_RATE_WINDOW:1m}

external-limits:
  dictionary-body-bytes: ${DICTIONARY_MAX_BODY_BYTES:1048576}
  translation-body-bytes: ${TRANSLATION_MAX_BODY_BYTES:262144}
  maximum-entries: ${DICTIONARY_MAX_ENTRIES:5}
  maximum-meanings: ${DICTIONARY_MAX_MEANINGS:20}
  maximum-definition-characters: ${DICTIONARY_MAX_DEFINITION_CHARACTERS:2000}
  maximum-example-characters: ${DICTIONARY_MAX_EXAMPLE_CHARACTERS:2000}
  maximum-translation-characters: ${TRANSLATION_MAX_CHARACTERS:10000}
  maximum-phonetic-characters: ${DICTIONARY_MAX_PHONETIC_CHARACTERS:200}
  maximum-audio-url-characters: ${DICTIONARY_MAX_AUDIO_URL_CHARACTERS:2048}
