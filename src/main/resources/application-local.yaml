spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/english_reading}
    username: ${DB_USERNAME:english_user}
    password: ${DB_PASSWORD:english_password}
    driver-class-name: org.postgresql.Driver
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

security:
  jwt:
    # Development-only value. Production has no fallback.
    secret: ${JWT_SECRET:local-development-secret-change-before-production}

dictionary:
  free:
    base-url: ${DICTIONARY_FREE_BASE_URL:https://api.dictionaryapi.dev}

translation:
  libre:
    base-url: ${LIBRETRANSLATE_BASE_URL:http://localhost:5000}
    api-key: ${LIBRETRANSLATE_API_KEY:}
