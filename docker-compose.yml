services:
  postgres:
    image: postgres:17
    container_name: english-reading-postgres
    environment:
      POSTGRES_DB: english_reading
      POSTGRES_USER: english_user
      POSTGRES_PASSWORD: english_password
    ports:
      - "5432:5432"
    volumes:
      - english_reading_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U english_user -d english_reading"]
      interval: 10s
      timeout: 5s
      retries: 5

  libretranslate:
    image: libretranslate/libretranslate:v1.9.6
    container_name: english-reading-libretranslate
    ports:
      - "5000:5000"
    command: ["--load-only", "en,es"]
    volumes:
      - libretranslate_data:/home/libretranslate/.local

volumes:
  english_reading_data:
  libretranslate_data:
